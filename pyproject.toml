[project]
name = "fraudguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "samarthamber", email = "samarth@amberflux.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "evidently>=0.7.23",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
    "streamlit>=1.64.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

