services:
  db:
    image: postgres:16-alpine
    container_name: fraudguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraudguard
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: fraudguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudguard -d fraudguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://fraudguard:secretpassword@db:5432/fraudguard
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: fraudguard-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://fraudguard:secretpassword@db:5432/fraudguard
    command: >
      mlflow server
      --backend-store-uri postgresql://fraudguard:secretpassword@db:5432/fraudguard
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  mlflow_artifacts:
